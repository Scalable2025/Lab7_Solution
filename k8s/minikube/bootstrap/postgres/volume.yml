# Customer volume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-customer-pv
spec:
  storageClassName: manual
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /mnt/data/customer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-customer-pvc
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
